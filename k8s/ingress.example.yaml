apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-gateway
  namespace: ecommerce
spec:
  ingressClassName: nginx
  tls:
    - hosts: [shop.example.com]
      secretName: ecommerce-ingress-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

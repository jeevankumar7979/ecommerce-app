            - {name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: {secretKeyRef: {name: ecommerce-runtime, key: kafka-bootstrap-servers}}}
            - {name: JWT_TOKEN_URI, valueFrom: {secretKeyRef: {name: ecommerce-runtime, key: jwt-token-uri}}}
            - {name: SERVICE_CLIENT_ID, value: ecommerce-service}
            - {name: SERVICE_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: ecommerce-runtime, key: service-client-secret}}}
            - {name: JWT_ISSUER_URI, valueFrom: {secretKeyRef: {name: ecommerce-runtime, key: jwt-issuer-uri}}}
            - {name: JWT_JWK_SET_URI, valueFrom: {secretKeyRef: {name: ecommerce-runtime, key: jwt-jwk-set-uri}}}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, initialDelaySeconds: 30, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, initialDelaySeconds: 60, periodSeconds: 20}
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {cpu: "2", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
      # Attach a registry pull secret here if your GHCR packages are private.
---

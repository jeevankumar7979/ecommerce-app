name: ecommerce

x-service-env: &service-env
  CONFIG_SERVER_URI: http://config-server:8888
  EUREKA_URI: http://discovery-server:8761/eureka/
  JWT_ISSUER_URI: http://localhost:8180/realms/ecommerce
  JWT_JWK_SET_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
  JWT_TOKEN_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/token
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  TRACE_SAMPLE_PROBABILITY: "1.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces

services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    networks: [backend]
    restart: unless-stopped

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?Copy .env.example to .env and set local passwords}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Copy .env.example to .env and set local passwords}
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payments"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    networks: [backend]
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.0
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for i in {1..60}; do
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1 && break
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-requests --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-results --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order-status --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_started
    networks: [backend]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [backend]
    restart: unless-stopped

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    environment:
      CONFIG_SEARCH_LOCATIONS: file:/config
    volumes:
      - ./config:/config:ro
    ports: ["8888:8888"]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports: ["8761:8761"]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Copy .env.example to .env}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./identity/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports: ["8180:8080"]
    networks: [backend]
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      <<: *service-env
      REDIS_HOST: redis
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/orders
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      SERVICE_CLIENT_ID: ecommerce-service
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET:?Copy .env.example to .env}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mongo:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      inventory-service:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      <<: *service-env
      DATABASE_URL: jdbc:postgresql://inventory-db:5432/inventory
      DATABASE_USERNAME: inventory
      DATABASE_PASSWORD: ${INVENTORY_DB_PASSWORD:?Copy .env.example to .env}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      inventory-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      <<: *service-env
      DATABASE_URL: jdbc:postgresql://payment-db:5432/payments
      DATABASE_USERNAME: payment
      DATABASE_PASSWORD: ${PAYMENT_DB_PASSWORD:?Copy .env.example to .env}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      payment-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment: *service-env
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on: [jaeger]
    networks: [backend]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]
    networks: [backend]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    networks: [backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]
    networks: [backend]
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  mongo-data:
  inventory-db-data:
  payment-db-data:
  prometheus-data:
  grafana-data:
